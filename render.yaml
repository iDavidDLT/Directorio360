databases:
  - name: directorio360-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
services:
  - type: web
    name: directorio360-mvc
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: directorio360-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
